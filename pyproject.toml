[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "autocfd5-aiml-submission"
version = "0.1.2"
description = "Reproducible DrivAerML evaluation and submission packaging for AutoCFD5 AIML"
readme = "README.md"
requires-python = ">=3.12,<3.13"
license = {file = "LICENSE"}
authors = [{name = "AutoCFD5 organisers"}]
dependencies = [
  "numpy==2.2.6",
  "vtk==9.5.2",
]

[project.optional-dependencies]
test = [
  "pytest==8.4.2",
  "ruff==0.12.11",
  "build==1.3.0",
]

[project.scripts]
autocfd5-aiml = "autocfd5_aiml.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/autocfd5_aiml"]

[tool.hatch.build.targets.wheel.force-include]
"contract" = "autocfd5_aiml/contract"

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = [
  "src/autocfd5_aiml/core",
  "src/autocfd5_aiml/scores.py",
]

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
ignore = ["E501"]
